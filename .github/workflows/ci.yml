name: Open Grid CI

on:
  push:
    branches: [main, 'ue5-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cpp-core:
    name: C++20 Physics Core (Release) + CTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure & Build rs_core (Release)
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build -j
      - name: Run All Physics & Telemetry CTests
        run: ctest --test-dir core/build --output-on-failure --parallel "$(nproc)"

  cpp-core-asan:
    name: C++20 Physics Core (ASan + UBSan) + CTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Memory Leak & Undefined Behavior Check (ASan + UBSan, -O1 -g)
        run: |
          cmake -S core -B core/build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build core/build-asan -j
          ctest --test-dir core/build-asan --output-on-failure --parallel "$(nproc)"

  core-windows:
    # Unreal on Windows compiles the core with MSVC, as one C++20 unit (ue5_plugin/.../RsCoreUnity.cpp). This job
    # catches MSVC-only errors for free, before any paid Unreal session.
    name: C++ Core on Windows (MSVC) + Unreal-style single-unit compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure & Build rs_core (MSVC, Release)
        run: |
          cmake -S core -B core/build -A x64
          cmake --build core/build --config Release --parallel
      - name: Run All Physics & Telemetry CTests
        run: ctest --test-dir core/build -C Release --output-on-failure --parallel $env:NUMBER_OF_PROCESSORS
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Single-unit C++20 compile (same file list and order as RsCoreUnity.cpp)
        shell: pwsh
        run: |
          $unity = Get-Content ue5_plugin/OpenGridPhysics/Source/OpenGridPhysics/Private/RsCoreUnity.cpp |
            Where-Object { $_ -match '^#include "src/' }
          if ($unity.Count -lt 17) { throw "RsCoreUnity.cpp lists $($unity.Count) core sources, expected 17" }
          $unity | Set-Content core/build/rs_unity.cpp
          cl /nologo /std:c++20 /EHsc /W3 /utf-8 /permissive- /c /Icore/include /Icore/third_party /Icore `
            core/build/rs_unity.cpp /Fo:core/build/rs_unity.obj
          if ($LASTEXITCODE -ne 0) { throw "single-unit compile failed" }

  web-and-cloud:
    name: Mod Validator, WebGPU Build & Cloud Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate Car Physics Assets (Anti-Cheat / Poly Bounds)
        run: node tools/validate_mod.mjs --dir data/cars
      - name: Licence ledgers (kit and car assets) and the CREDITS.md "Kit assets" section
        run: node tools/assets/check_licences.mjs
      - name: Physics reference data (powertrain, aero, CG/inertia) and track sanity
        run: |
          node tools/physics/check_powertrain.mjs
          node tools/physics/aero_check.mjs
          node tools/physics/inertia_reference.mjs --check
          node tools/physics/torque_reference.mjs --check
          node tools/physics/import_chrono_vehicles.mjs --verify
          node tools/physics/check_chrono_vehicles.mjs
          node tools/physics/check_epa_rows.mjs
          node tools/validation/gps_layers_check.mjs
          node tools/physics/brake_reference.mjs
          node tools/physics/brake_reference.mjs --tracks data/validation/tracks-extra
          node tools/validation/track_sanity.mjs
      - name: Physics reference data (licence, units, physical plausibility)
        run: node tools/validate_physics_reference.mjs
      - name: "Vehicle physics package (open-grid-physics): handling checks and a bot race"
        working-directory: packages/vehicle-physics
        run: npm test
      - name: Typecheck & Build WebGPU Client
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run test:gate
          npm run test:lab
          npm run test:freeroam
      - name: Typecheck & Test Cloudflare Worker Backend
        working-directory: cloud
        run: |
          npm ci
          npx tsc --noEmit
          npm run test:pace
          npm run test:competitive
      - name: Self-hosted servers (PeerJS matchmaking smoke test, big Free Roam room server)
        working-directory: server
        run: |
          npm ci
          npm test
