# Open Grid online service (Cloudflare Workers free plan). Deploy: npm run db:remote && npm run deploy
# Secrets (never in this file): `wrangler secret put IP_SALT` and `wrangler secret put VERIFIER_KEY`.
name = "opengrid"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# Uncomment once the open-grid.racing zone is added to this Cloudflare account:
# routes = [{ pattern = "api.open-grid.racing", zone_name = "open-grid.racing", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "opengrid"
database_id = "b98ba429-a11d-44ad-89c4-e0dc34d81e42"   # region EEUR
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RaceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaceRoom"]

[vars]
# web origins allowed to call the service (comma separated)
ALLOWED_ORIGINS = "*"   # the API uses bearer tokens (no cookies), so any web origin may call it
# Ranked splits, championships and protests are free for everyone (hobby project, best-effort).
# Set to "1" only if a paid Supporter Pass is ever brought back.
REQUIRE_SUPPORTER_PASS = "0"
